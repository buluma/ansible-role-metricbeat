---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: try metricbeat version
      ansible.builtin.command:
        cmd: metricbeat version
      changed_when: false
      failed_when:
        - '"metricbeat version 7" not in metricbeat_test_one.stdout'
      register: metricbeat_test_one
